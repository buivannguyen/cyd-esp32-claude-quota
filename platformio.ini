; PlatformIO Project Configuration File
;
; Cấu hình tối thiểu cho board ESP32 CYD (ESP32-2432S028R)
;   - MCU: ESP32-WROOM-32, nạp qua CH340
;   - Màn hình: ILI9341 240x320, SPI
;   - Cảm ứng: XPT2046 (SPI riêng) - chưa khai báo indev, xem README
;
; Dùng làm khung khởi tạo cho các dự án CYD tiếp theo.
; https://docs.platformio.org/page/projectconf.html

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
board_build.partitions = partitions.csv

build_flags =
	; ---- LVGL: dùng file cấu hình trong include/lv_conf.h ----
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"

	; ---- TFT_eSPI: cấu hình đầy đủ (bỏ qua User_Setup.h) ----
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D TFT_INVERSION_OFF=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=12
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D SPI_TOUCH_FREQUENCY=2500000

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	lvgl/lvgl@9.2.2
